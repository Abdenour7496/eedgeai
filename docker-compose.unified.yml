# Compose project name: containers, networks and volumes are prefixed aiedge-*
# regardless of the folder the repo is cloned into.
name: aiedge

services:

  # ── Data stores ───────────────────────────────────────────────────────────────

  falkordb:
    # Pinned to the newest 4.x. FalkorDB 6.x (Rust engine) has no supported
    # in-place upgrade path from 4.x data until 6.2 — do not move to 6.x on an
    # existing falkordb_data volume until then.
    image: falkordb/falkordb:4.22.3
    ports:
      - "6379:6379"
      - "3001:3000"
    environment:
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      REDIS_ARGS: --appendonly yes --appendfsync everysec
      BROWSER: "1"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  graphiti:
    build: ./graphiti
    ports:
      - "8000:8000"
    environment:
      OPENAI_BASE_URL: ${GRAPHITI_API_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${GRAPHITI_API_KEY:-ollama}
      MODEL_NAME: ${GRAPHITI_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL_NAME: ${GRAPHITI_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-768}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_DATABASE: ${FALKORDB_DATABASE:-eedgeai}
      db_backend: falkordb
      # Graphiti 0.22.0 marks these optional fields as required during settings
      # validation even for DB_BACKEND=falkordb. They are never connected to.
      NEO4J_URI: bolt://unused:7687
      NEO4J_USER: unused
      NEO4J_PASSWORD: unused
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:1.1.3-standalone
    environment:
      CONFIG_PATH: /app/mcp/config/config.yaml
      OPENAI_API_URL: ${GRAPHITI_API_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${GRAPHITI_API_KEY:-ollama}
      MODEL_NAME: ${GRAPHITI_MODEL:-qwen2.5:7b}
      EMBEDDER_MODEL: ${GRAPHITI_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-768}
      FALKORDB_URI: redis://falkordb:6379
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      FALKORDB_DATABASE: ${FALKORDB_DATABASE:-eedgeai}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-documents}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
    volumes:
      - ./graphiti-mcp/config.yaml:/app/mcp/config/config.yaml:ro
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  # ── Ollama (local LLM) ────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:0.40.15
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to enable NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.40.15
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OLLAMA_MODEL:-llama3.2} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} &&
        ollama pull ${GRAPHITI_MODEL:-qwen2.5:7b} &&
        ollama pull ${OLLAMA_VISION_MODEL:-llava:7b}
    restart: "no"

  openclaw-config-init:
    image: alpine:3.24
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /config
        cp /seed/openclaw.json /config/openclaw.json
        chown -R 1000:1000 /config
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-openclaw_config}:/config
      - ./openclaw-config/openclaw.json:/seed/openclaw.json:ro
    restart: "no"

  # ── OpenClaw + relay ──────────────────────────────────────────────────────────

  openclaw:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    depends_on:
      openclaw-config-init:
        condition: service_completed_successfully
      graphiti-mcp:
        condition: service_started
    ports:
      - "18789:18789"
      - "18799:18799"
      - "18801:18801"
      - "9091:9091"
    environment:
      # Deliberately NOT set here (unlike the proxy service, which has its own
      # copy for RAG/vision calls): the bundled `claude` CLI prefers
      # ANTHROPIC_API_KEY over an OAuth/subscription login whenever it's
      # present in the environment, silently ignoring `claude login` even
      # after it succeeds. Leaving this unset forces the claude-cli backend to
      # actually use the Claude Pro/Max subscription session instead of
      # metered API billing.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT:-18790}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DOCKER_APT_PACKAGES: ${OPENCLAW_DOCKER_APT_PACKAGES:-}
      OPENCLAW_DISABLE_BONJOUR: "true"
      GRAPHITI_URL: http://graphiti:8000
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # ingest-cli embedding backend — mirrors the proxy's own copy of these
      # vars so both write vectors of the same dimension into the shared
      # "documents" Qdrant collection (768-dim, from nomic-embed-text).
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Document storage (SeaweedFS S3) for ingest-cli — best-effort, same as the
      # proxy's own copy of these vars; ingestion still works if unset/unreachable.
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-openclaw_config}:/home/node/.openclaw
      - ./openclaw-config/openclaw.json:/opt/openclaw-seed/openclaw.json:ro
      # Claude Code CLI's own login state (claude login) — separate from
      # OpenClaw's own config dir so the subscription auth survives restarts.
      - openclaw_claude_config:/home/node/.claude
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/18799' || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── GCOR Proxy ────────────────────────────────────────────────────────────────

  proxy:
    build: ./proxy
    ports:
      - "5001:5001"
    depends_on:
      graphiti:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # LLM backend — openai | anthropic | ollama | openclaw | copilot
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      VISION_BACKEND: ${VISION_BACKEND:-anthropic}
      VISION_MODEL: ${VISION_MODEL:-claude-3-5-sonnet-20241022}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-haiku-4-5-20251001}
      # GitHub Copilot
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_BASE_URL: ${COPILOT_BASE_URL:-https://api.githubcopilot.com}
      COPILOT_CHAT_MODEL: ${COPILOT_CHAT_MODEL:-gpt-4.1}
      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Embedding
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Graphiti temporal knowledge graph backed by FalkorDB
      GRAPHITI_URL: http://graphiti:8000
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-documents}
      GRAPHITI_TOP_K: ${GRAPHITI_TOP_K:-8}
      # OpenClaw backend
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://openclaw:18799/v1}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # RAG switch
      ENABLE_RAG: ${ENABLE_RAG:-true}
      # Cognitive infrastructure
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.0}
      AGENT_ID: ${AGENT_ID:-}
      DEFAULT_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
      # Document storage (SeaweedFS S3) — best-effort; ingestion still works if unset/unreachable.
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
    volumes:
      - ./proxy/main.py:/app/main.py:ro
      - ./proxy/document_intel.py:/app/document_intel.py:ro
      - ./proxy/templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Document storage (SeaweedFS, S3-compatible) ───────────────────────────────
  # Replaces MinIO, which stopped publishing images (Oct 2025) and was archived
  # (Apr 2026). `weed mini` runs master+volume+filer+S3 in one container.
  # AWS_ACCESS_KEY_ID/SECRET become the S3 admin identity, so anonymous access
  # is denied and buckets are private. -bucket creates both buckets at startup
  # (idempotent), replacing the old minio-init container.

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command:
      - mini
      - -bucket=${DOCS_S3_BUCKET:-documents},${OPENWEBUI_S3_BUCKET:-openwebui}
      - -admin.password=${SEAWEEDFS_ADMIN_PASSWORD:-}
    ports:
      # Host ports kept from the MinIO layout: 9000 = S3 API, 9001 = admin UI.
      # Only S3 and the admin UI are published; filer/master/volume gRPC stay
      # on the internal network.
      - "9000:8333"
      - "9001:12535"
    environment:
      AWS_ACCESS_KEY_ID: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      AWS_SECRET_ACCESS_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # One-off copy of documents from the old MinIO volume into SeaweedFS.
  # Only runs when asked:  docker compose -f docker-compose.unified.yml \
  #   --profile migrate run --rm storage-migrate
  # Needs a MinIO image already cached locally (Docker Hub no longer serves it);
  # override with LEGACY_MINIO_IMAGE if yours is tagged differently.
  minio-legacy:
    profiles: ["migrate"]
    image: ${LEGACY_MINIO_IMAGE:-minio/minio:latest}
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      MINIO_ROOT_PASSWORD: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
    volumes:
      - docs_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"

  storage-migrate:
    profiles: ["migrate"]
    build: ./ingest-watcher
    depends_on:
      minio-legacy:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      SRC_ENDPOINT_URL: http://minio-legacy:9000
      DST_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      MIGRATE_BUCKETS: ${DOCS_S3_BUCKET:-documents},${OPENWEBUI_S3_BUCKET:-openwebui}
    volumes:
      - ./tools/migrate_s3.py:/app/migrate_s3.py:ro
    command: ["python", "migrate_s3.py"]
    restart: "no"

  # Polls documents/inbox/ and pushes new files into the proxy's /api/ingest —
  # see ingest-watcher/watcher.py for why this exists instead of a webhook.
  ingest-watcher:
    build: ./ingest-watcher
    depends_on:
      seaweedfs:
        condition: service_healthy
      proxy:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
      S3_INBOX_PREFIX: inbox/
      S3_PROCESSED_PREFIX: processed/
      S3_FAILED_PREFIX: failed/
      PROXY_INGEST_URL: http://proxy:5001/api/ingest
      POLL_INTERVAL_SECONDS: ${INGEST_WATCH_INTERVAL_SECONDS:-10}
      INGEST_COLLECTION: ${GRAPHITI_GROUP_ID:-documents}
      INGEST_ENABLE_DOCINT: ${INGEST_ENABLE_DOCINT:-false}
      INGEST_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
    restart: unless-stopped

  # ── TTS (OpenAI-compatible Edge TTS) ─────────────────────────────────────────

  tts:
    image: travisvn/openai-edge-tts:latest
    ports:
      - "5050:5050"
    environment:
      PORT: "5050"
      API_KEY: ${TTS_API_KEY:-tts-local}
      REQUIRE_API_KEY: "true"
      DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-en-US-AriaNeural}
      DEFAULT_RESPONSE_FORMAT: ${TTS_DEFAULT_FORMAT:-mp3}
      DEFAULT_SPEED: ${TTS_DEFAULT_SPEED:-1.0}
    restart: unless-stopped

  # ── OpenWebUI ─────────────────────────────────────────────────────────────────

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_BASE_URL: http://proxy:5001/v1
      OPENAI_API_KEY: openclaw
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://proxy:5001/v1
      RAG_OPENAI_API_KEY: openclaw
      ENABLE_RAG_LOCAL_WEB_FETCH: "false"
      # Ollama — fallback model when Anthropic is unavailable
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODELS: openclaw
      DEFAULT_USER_ROLE: user
      ENABLE_MODEL_FILTER: "false"
      # TTS — OpenAI-compatible Edge TTS
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://tts:5050/v1
      AUDIO_TTS_OPENAI_API_KEY: ${TTS_API_KEY:-tts-local}
      AUDIO_TTS_MODEL: tts-1
      AUDIO_TTS_VOICE: ${TTS_DEFAULT_VOICE:-en-US-AriaNeural}
      # File/attachment storage on the stack-wide SeaweedFS S3 store (bucket
      # created by the seaweedfs service at startup) instead of the local volume — the sqlite DB, config, etc.
      # still live on openwebui_data below; only uploaded files move to S3.
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_ACCESS_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_REGION_NAME: us-east-1
      S3_BUCKET_NAME: ${OPENWEBUI_S3_BUCKET:-openwebui}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      proxy:
        condition: service_healthy
      ollama:
        condition: service_healthy
      tts:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  # ── Monitoring ────────────────────────────────────────────────────────────────

  falkordb-exporter:
    image: oliver006/redis_exporter:v1.97.0
    environment:
      REDIS_ADDR: redis://falkordb:6379
      REDIS_PASSWORD: ${FALKORDB_PASSWORD:-}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      graphiti:
        condition: service_healthy
      falkordb-exporter:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "3000:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  falkordb_data:
  # Legacy volumes are deliberately retained for rollback/data export. No active
  # service mounts them after the Graphiti/FalkorDB migration.
  neo4j_data:
  qdrant_data:
  openclaw_config:
  openclaw_claude_config:
  openwebui_data:
  ollama_data:
  # Legacy MinIO volume — kept so `--profile migrate` can copy it into SeaweedFS.
  docs_minio_data:
  seaweedfs_data:
  buzz_postgres_data:
  buzz_redis_data:
  buzz_git_data:
